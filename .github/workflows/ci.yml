name: CI

# Runs on every PR and on main. Required checks before merge:
#   checks   typecheck · unit tests (incl. the HTML router smoke test) · production build (+ bundle secret check)
#   security gitleaks over the full git history · npm audit (fails on critical)
# No Supabase credentials are used; the build gets placeholder VITE_* values.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build (fails if a secret reaches dist/)
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.invalid
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          VITE_API_URL: https://admin.placeholder.invalid
          VITE_RAZORPAY_KEY_ID: rzp_test_placeholder

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          V=8.21.2
          curl -sSfL -o gitleaks_${V}_linux_x64.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz
          curl -sSfL -o checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt
          grep "gitleaks_${V}_linux_x64.tar.gz" checksums.txt | sha256sum -c -
          tar xzf gitleaks_${V}_linux_x64.tar.gz gitleaks
          ./gitleaks git . --log-opts="--all" --redact --no-banner
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (production deps; fails on critical)
        run: |
          npm audit --omit=dev || true
          npm audit --omit=dev --audit-level=critical
